<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiketIn Pro - Live Master Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col p-6">

    <header class="max-w-6xl w-full mx-auto flex justify-between items-center mb-6 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
        <div>
            <h1 class="text-xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">TIKETIN MONITORING</h1>
            <p class="text-xs text-slate-400">Sinkronisasi Otomatis Real-time Tanpa Refresh</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-emerald-400 font-mono">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> LIVE SINKRON
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col gap-6">
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Total Scan</p>
                <h3 class="text-2xl font-black text-indigo-400 font-mono mt-1" id="stat-total">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Berhasil</p>
                <h3 class="text-2xl font-black text-emerald-400 font-mono mt-1" id="stat-success">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Gagal / Duplikat</p>
                <h3 class="text-2xl font-black text-rose-400 font-mono mt-1" id="stat-failed">0</h3>
            </div>
        </div>

        <div class="flex bg-slate-900 p-1 rounded-xl max-w-sm border border-slate-800">
            <button onclick="switchTab('all')" id="tab-all" class="flex-1 py-2 rounded-lg text-xs font-bold uppercase transition-all bg-indigo-600 text-white">Semua</button>
            <button onclick="switchTab('success')" id="tab-success" class="flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400">Berhasil</button>
            <button onclick="switchTab('failed')" id="tab-failed" class="flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400">Gagal</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex-1 shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 text-xs font-bold border-b border-slate-800 uppercase">
                            <th class="p-4">Waktu</th>
                            <th class="p-4">Nama</th>
                            <th class="p-4">Kode Tiket</th>
                            <th class="p-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800/40 font-medium">
                        <tr><td colspan="4" class="p-8 text-center text-slate-500">Menghubungkan ke server...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://ctwpgzjsqkxkaornfgjd.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0d3BnempzcWt4a2Fvcm5mZ2pkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMzAzMzksImV4cCI6MjA5NTYwNjMzOX0.nSkB-m9UjDJ0RgXx_akQCxNJjwyLgj-QbH25S_zCVS8";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterData = [], currentTab = 'all';

        async function loadData() {
            const { data } = await _supabase.from('transactions').select('*').order('updated_at', { ascending: false }).limit(50);
            masterData = data || [];
            updateUI();
        }

        function updateUI() {
            // Hitung Counter Statistik
            // Anggap Sukses jika statusnya 'USED' setelah diproses oleh scanner
            const total = masterData.filter(item => item.status === 'USED' || item.status === 'DUPLICATE' || item.status === 'FAILED').length;
            const success = masterData.filter(item => item.status === 'USED').length;
            const failed = total - success;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-success').innerText = success;
            document.getElementById('stat-failed').innerText = failed;

            // Filter data sesuai halaman (Tab aktif)
            let filtered = masterData;
            if (currentTab === 'success') filtered = masterData.filter(item => item.status === 'USED');
            if (currentTab === 'failed') filtered = masterData.filter(item => item.status === 'DUPLICATE' || item.status === 'FAILED');

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-600">Belum ada aktivitas data log</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const date = item.updated_at ? new Date(item.updated_at) : new Date();
                const timeStr = date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
                const isSuccess = item.status === 'USED';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-950/40">
                        <td class="p-4 text-xs font-mono text-slate-500">${timeStr}</td>
                        <td class="p-4 text-slate-200">${item.customer_name || 'Guest'}</td>
                        <td class="p-4 font-mono text-xs text-indigo-400">${item.ticket_code}</td>
                        <td class="p-4 text-center">
                            <span class="px-2 py-1 rounded text-[10px] font-bold ${isSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                                ${isSuccess ? 'BERHASIL' : 'GAGAL / DUPLIKAT'}
                            </span>
                        </td>
                    </tr>`;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'success', 'failed'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                btn.className = t === tab ? "flex-1 py-2 rounded-lg text-xs font-bold uppercase bg-indigo-600 text-white" : "flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400";
            });
            updateUI();
        }

        // AKSI REAL-TIME: Otomatis tangkap perubahan data saat HP melakukan scan
        _supabase.channel('live-changes')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'transactions' }, payload => {
                masterData = masterData.filter(i => i.id !== payload.new.id);
                masterData.unshift(payload.new);
                updateUI();
            }).subscribe();

        window.onload = loadData;
    </script>
</body>
</html>
