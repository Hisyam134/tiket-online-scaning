<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiketIn Pro - Live Master Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col p-6">

    <header class="max-w-6xl w-full mx-auto flex justify-between items-center mb-6 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
        <div>
            <h1 class="text-xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">TIKETIN LIVE MONITORING</h1>
            <p class="text-xs text-slate-400">Sinkronisasi Otomatis Aliran Gate (Termasuk Deteksi Tiket Palsu)</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-emerald-400 font-mono">
            <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> LIVE AKTIF
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col gap-6">
        
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Total Scan</p>
                <h3 class="text-3xl font-black text-indigo-400 font-mono mt-1" id="stat-total">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Berhasil</p>
                <h3 class="text-3xl font-black text-emerald-400 font-mono mt-1" id="stat-success">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-400 font-medium">Gagal / Duplikat / Palsu</p>
                <h3 class="text-3xl font-black text-rose-400 font-mono mt-1" id="stat-failed">0</h3>
            </div>
        </div>

        <div class="flex bg-slate-900 p-1 rounded-xl max-w-sm border border-slate-800">
            <button onclick="switchTab('all')" id="tab-all" class="flex-1 py-2 rounded-lg text-xs font-bold uppercase transition-all bg-indigo-600 text-white">Semua</button>
            <button onclick="switchTab('success')" id="tab-success" class="flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400">Berhasil</button>
            <button onclick="switchTab('failed')" id="tab-failed" class="flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400">Gagal</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex-1 shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-950 text-slate-400 text-xs font-bold border-b border-slate-800 uppercase">
                            <th class="p-4">Nama Pengunjung</th>
                            <th class="p-4">Kode Tiket</th>
                            <th class="p-4 text-center">Status Akses</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800/40 font-medium">
                        <tr><td colspan="3" class="p-8 text-center text-slate-500">Menghubungkan jaringan data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://ctwpgzjsqkxkaornfgjd.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0d3BnempzcWt4a2Fvcm5mZ2pkIiwicm9sZSI6ImFub24iLAJpYXQiOjE3ODAwMzAzMzksImV4cCI6MjA5NTYwNjMzOX0.nSkB-m9UjDJ0RgXx_akQCxNJjwyLgj-QbH25S_zCVS8";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let localDataStore = [], currentTab = 'all';

        // 1. AMBIL DATA AWAL SAAT DASHBOARD DIBUKA
        async function initFetch() {
            const { data } = await _supabase.from('transactions').select('*');
            localDataStore = data || [];
            updateDashboardUI();
        }

        // 2. HITUNG DAN RENDER DATA KE LAYAR DASHBOARD
        function updateDashboardUI() {
            // Filter data yang valid masuk hitungan log scan
            const success = localDataStore.filter(item => item.status === 'USED');
            const failed = localDataStore.filter(item => item.status === 'DUPLICATE' || item.status === 'FAILED');
            const total = success.length + failed.length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-success').innerText = success.length;
            document.getElementById('stat-failed').innerText = failed.length;

            let renderingData = [];
            if (currentTab === 'all') {
                renderingData = localDataStore.filter(i => i.status === 'USED' || i.status === 'DUPLICATE' || i.status === 'FAILED');
            } else if (currentTab === 'success') {
                renderingData = success;
            } else if (currentTab === 'failed') {
                renderingData = failed;
            }

            // Urutkan berdasarkan ID / Waktu paling baru agar selalu muncul paling atas
            renderingData.sort((a, b) => b.id - a.id);

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (renderingData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-600">Tidak ada log aktivitas pada halaman ini</td></tr>`;
                return;
            }

            renderingData.forEach(item => {
                const checkSuccess = item.status === 'USED';
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-950/40">
                        <td class="p-4 text-slate-200">${item.customer_name || 'Tanpa Nama'}</td>
                        <td class="p-4 font-mono text-sm text-indigo-400">${item.ticket_code}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded text-xs font-bold ${checkSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                                ${checkSuccess ? 'BERHASIL' : 'GAGAL / DUPLIKAT / PALSU'}
                            </span>
                        </td>
                    </tr>`;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            ['all', 'success', 'failed'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tab ? "flex-1 py-2 rounded-lg text-xs font-bold uppercase bg-indigo-600 text-white" : "flex-1 py-2 rounded-lg text-xs font-medium uppercase text-slate-400";
            });
            updateDashboardUI();
        }

        // ==========================================
        // KUNCI REAL-TIME LISTENER (DUA JALUR SINKRONISASI)
        // ==========================================

        // JALUR A: Mendengar update tiket asli dari database (PAID -> USED / DUPLICATE)
        _supabase.channel('gate-database-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, payload => {
                localDataStore = localDataStore.filter(i => i.id !== payload.new.id);
                localDataStore.push(payload.new);
                updateDashboardUI();
            }).subscribe();

        // JALUR B: Mendengar siaran langsung "tiket palsu" dari HP Scanner tanpa lewat tabel DB
        _supabase.channel('gate-broadcast-room')
            .on('broadcast', { event: 'ticket-scanned' }, payload => {
                // Hapus jika ada duplikasi ID instan, lalu masukkan payload siaran tiket palsu
                localDataStore = localDataStore.filter(i => i.id !== payload.payload.id);
                localDataStore.push(payload.payload);
                updateDashboardUI();
            }).subscribe();

        window.onload = initFetch;
    </script>
</body>
</html>
